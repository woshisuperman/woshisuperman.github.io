<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f6f8fa;
        }
        h1 { color: #24292f; margin-bottom: 5px; }
        p { color: #57606a; margin-bottom: 30px; }

        /* 调整布局，确保在手机上能自动换行 */
        .links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90%;
        }
        
        .btn {
            padding: 12px 24px;
            text-decoration: none;
            color: white;
            border-radius: 6px;
            font-weight: bold;
            transition: transform 0.2s, opacity 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 颜色区分 */
        .video-btn { background-color: #ff0000; }     /* 视频-红 */
        .feature-btn { background-color: #007bff; }   /* 新页面-蓝 */
        .kernel-btn { background-color: #2f363d; }    /* 内核-深灰 */

        .btn:hover { 
            opacity: 0.9; 
            transform: translateY(-2px); 
        }
    </style>
</head>
<body>

    <h1>你好，我是syj</h1>
    <p>欢迎来到我的个人主页</p>

    <div class="links">
        <a href="video.html" class="btn video-btn">🎬 LVI介绍视频</a>
        
        <a href="video2.html" class="btn feature-btn">🔍 工业互联网项目介绍视频</a>
        
        <a href="commits.html" class="btn kernel-btn" target="_blank">🐧 Linux Kernel Commits</a>
    </div>

</body>
</html>
