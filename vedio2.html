<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>LVI 详细展示 - 视频与图像</title>
    <style>
        /* 继承原有的深色调美学 */
        body { background: #000; color: #fff; text-align: center; font-family: 'PingFang SC', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        h2 { border-bottom: 1px solid #333; padding-bottom: 10px; margin-top: 40px; color: #00aaff; }
        p { color: #ccc; font-size: 1em; line-height: 1.6; margin-top: 15px; }

        /* 统一媒体容器样式 */
        .media-box { 
            background: #111; 
            padding: 20px; 
            border-radius: 12px; 
            border: 1px solid #222; 
            margin-bottom: 40px;
            transition: transform 0.3s ease;
        }
        .media-box:hover { border-color: #444; }

        /* 视频与图片响应式处理 */
        .display-content { 
            width: 100%; 
            border-radius: 6px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .back-link { display: inline-block; margin-top: 50px; color: #666; text-decoration: none; font-size: 0.9em; }
        .back-link:hover { color: #00aaff; }
    </style>
</head>
<body>

<div class="container">
    
    <section class="media-box">
        <h2>视频展示</h2>
        <video class="display-content" controls>
            <source src="video2.mp4" type="video/mp4">
            您的浏览器不支持 HTML5 视频。
        </video>
        <p>工业互联网终端演示</p>
    </section>

    <section class="media-box">
        <h2>宣传页</h2>
        <img src="image.jpg" alt="展示图片" class="display-content">
        <p>产品宣传页</p>
    </section>

    <a href="index.html" class="back-link">← 返回主页</a>
</div>

</body>
</html>
